# Drop-in for a box where the gateway itself runs the kernel wall
# (firewall=auto|nft|iptables|iptables-legacy) or reconciles routing= at
# start (wg-quick on a gateway-rendered /etc/wireguard/<iface>.conf).
# Install at /etc/systemd/system/doxxgateway.service.d/kernel-wall.conf, then
# `systemctl daemon-reload && systemctl restart doxxgateway`.
#
# NEVER on a doxx.net VPS device seat: there firewall= must be off (the
# host's wall owns the server's ports) and the base unit is the whole story.
#
# What it widens, and only this: the two capabilities nft/ip/wg need, the
# WireGuard conf directory, and exec of the system tools the wall and the
# routing reconcile shell out to. Everything else in the base unit stands.

[Service]
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_NET_ADMIN CAP_NET_RAW
ReadWritePaths=/etc/wireguard
InaccessiblePaths=
InaccessiblePaths=-/etc/shadow -/etc/gshadow -/etc/ssh -/var/lib/dn-vps
NoExecPaths=
ExecPaths=
ExecPaths=/usr/local/bin/doxxGateway /usr/sbin /usr/bin /bin /sbin
MemoryDenyWriteExecute=no
# Backstop: even a SIGKILL'd gateway leaves no kernel wall behind.
ExecStopPost=/usr/local/bin/doxxGateway cleanup-firewall -config /etc/doxxgateway/doxxGateway.conf
